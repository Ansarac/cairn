name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # cairn's claim is that it works with any agent that can run a shell
      # command. That stays true only if exactly one directory knows about any
      # particular product. See CLAUDE.md, "The one structural rule".
      #
      # "cursor" is matched separately and case-sensitively: it is also cairn's
      # own word for the server-side read position, so a case-insensitive match
      # would flag the `cursors` table and every sqlite3 cursor in store.py.
      - name: Guard the core against vendor coupling
        run: |
          if grep -rniE 'claude|anthropic|codex|copilot' src/cairn \
               --include='*.py' --exclude-dir=adapters; then
            echo "::error::vendor name outside src/cairn/adapters/"
            exit 1
          fi
          if grep -rnE 'Cursor|CURSOR|\.cursor|cursor[-_/](cli|agent|ide|rules)' src/cairn \
               --include='*.py' --exclude-dir=adapters; then
            echo "::error::vendor name outside src/cairn/adapters/"
            exit 1
          fi
          echo "core is vendor-free"

      # Every test is offline: the walking-skeleton test binds an ephemeral
      # loopback port and nothing reaches the network.
      - name: Test
        run: uv run pytest

  # A deployment artefact nobody builds is one that rots quietly, and this one
  # would be discovered broken by whoever is standing up a second machine. Kept
  # out of `check` — the required status — so the gate on every PR stays fast.
  #
  # It runs the image rather than only building it: a Dockerfile that builds and
  # then exits on start looks identical to a working one in a build log.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the hub image
        run: docker build -t cairn-hub:ci .

      - name: It starts, answers, and stops cleanly
        run: |
          docker run -d --name hub -p 7777:7777 cairn-hub:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7777/v1/health; then ok=1; break; fi
            sleep 1
          done
          if [ -z "${ok:-}" ]; then docker logs hub; exit 1; fi
          # SIGTERM, which is what `docker stop` sends. Without hub.stop_on_terminate
          # this is exit 143 and every open bell stream is dropped with no close.
          docker stop hub
          code=$(docker inspect hub --format '{{.State.ExitCode}}')
          if [ "$code" != "0" ]; then echo "::error::hub exited $code on SIGTERM"; exit 1; fi
